<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 650" role="img" aria-labelledby="liz-look-title liz-look-desc">
<title id="liz-look-title">LIZ — asymmetric bone waistcoat, satin bodice and knee-high boots</title>
<desc id="liz-look-desc">Original full stage outfit concept on a faceless mannequin. Bone tailoring has peak lapels, a fitted waist and one long panel with oxblood lining. A structured black satin bodice and tailored shorts sit underneath. Crystal edging, silver waist bars and black knee-high boots complete the look.</desc>
<defs>
  <linearGradient id="liz-skin" x1="0" x2="1"><stop stop-color="#c9beb1"/><stop offset=".52" stop-color="#e1d8cd"/><stop offset="1" stop-color="#bfb3a6"/></linearGradient>
  <linearGradient id="liz-bone" x1="0" x2="1"><stop stop-color="#c4b8a6"/><stop offset=".28" stop-color="#f0e8dc"/><stop offset=".7" stop-color="#dfd4c3"/><stop offset="1" stop-color="#b9ab98"/></linearGradient>
  <linearGradient id="liz-satin" x1="0" x2="1"><stop stop-color="#17151a"/><stop offset=".35" stop-color="#423a43"/><stop offset=".56" stop-color="#211b24"/><stop offset=".85" stop-color="#37303a"/><stop offset="1" stop-color="#151217"/></linearGradient>
  <linearGradient id="liz-oxblood" x1="0" x2="1"><stop stop-color="#411420"/><stop offset=".28" stop-color="#853345"/><stop offset=".65" stop-color="#662333"/><stop offset="1" stop-color="#431522"/></linearGradient>
  <linearGradient id="liz-boot" x1="0" x2="1"><stop stop-color="#141317"/><stop offset=".28" stop-color="#29272d"/><stop offset=".47" stop-color="#45414a"/><stop offset=".64" stop-color="#201e24"/><stop offset="1" stop-color="#111014"/></linearGradient>
  <linearGradient id="liz-silver" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f5f4f1"/><stop offset=".35" stop-color="#bdc3ca"/><stop offset=".7" stop-color="#707680"/><stop offset="1" stop-color="#e4e5e7"/></linearGradient>
  <pattern id="liz-jacquard" width="22" height="28" patternUnits="userSpaceOnUse">
    <path d="M11 1C20 6 21 15 11 22C1 15 2 6 11 1ZM11 7C6 10 6 15 11 18C16 15 16 10 11 7ZM0 24Q5 19 10 25M12 25Q17 19 22 24" fill="none" stroke="#c2707e" stroke-opacity=".22" stroke-width=".85"/>
    <path d="M11 22v6" stroke="#d98793" stroke-opacity=".15" stroke-width=".7"/>
  </pattern>
  <pattern id="liz-suiting" width="5" height="5" patternUnits="userSpaceOnUse"><path d="M0 1h2M3 4h2" stroke="#74675d" stroke-opacity=".12" stroke-width=".45"/></pattern>
  <style>
    .liz-outline{stroke:#342c2c;stroke-width:1.4;stroke-linejoin:round}
    .liz-seam{fill:none;stroke:#817264;stroke-width:.9;opacity:.72}
    .liz-skin-line{fill:none;stroke:#a7998b;stroke-width:.8;opacity:.65}
    .liz-crystal{fill:none;stroke:#f0eff4;stroke-width:2.7;stroke-linecap:round;stroke-dasharray:.2 5.1}
    .liz-crystal-shadow{fill:none;stroke:#6c6877;stroke-width:4;opacity:.55}
  </style>
</defs>
